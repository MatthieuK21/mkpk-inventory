[build]
builder = "NIXPACKS"

[deploy]
# Format Railway officiel : une commande par entrée
preDeployCommand = ["npm run db:migrate"]
# Aussi au démarrage : logs visibles dans Deploy + filet de sécurité
# si le pre-deploy n'apparaît pas / n'est pas exécuté
startCommand = "npm run db:migrate && npm run start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
